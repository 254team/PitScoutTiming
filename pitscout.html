<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curie Pit Intel — Team 254</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #03080f;
  --surface: #070d17;
  --surface2: #0d1825;
  --surface3: #12202f;
  --border: #1a2d42;
  --border2: #243d57;
  --green: #00ff9d;
  --green-glow: #00ff9d33;
  --yellow: #ffcc00;
  --yellow-glow: #ffcc0033;
  --red: #ff3366;
  --red-glow: #ff336633;
  --blue: #00aaff;
  --blue-glow: #00aaff22;
  --orange: #ff8800;
  --orange-glow: #ff880033;
  --text: #cde4f8;
  --text-dim: #5a7a99;
  --accent: #00aaff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  min-height: 100vh;
  background-image: radial-gradient(ellipse 80% 40% at 50% -10%, #00aaff0d 0%, transparent 70%);
}

/* HEADER */
header {
  background: linear-gradient(180deg,#07111d,#03080f);
  border-bottom: 1px solid var(--border);
  padding: 0 22px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo { display:flex; align-items:center; gap:12px; }
.logo-num {
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:18px;
  color:#000;
  background:var(--green);
  padding:3px 9px;
  border-radius:4px;
}
.logo-title {
  font-family:'Orbitron',sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:3px;
  color:var(--accent);
}
.logo-sub {
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  color:var(--text-dim);
  letter-spacing:1px;
  margin-top:2px;
}
.hdr-right { display:flex; align-items:center; gap:10px; }
.live-dot {
  width:7px; height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 6px var(--green);
  animation:lpulse 2s infinite;
}
@keyframes lpulse{0%,100%{opacity:1}50%{opacity:.3}}
.last-upd { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); }
.btn-ref {
  background:var(--surface2);
  border:1px solid var(--border2);
  color:var(--accent);
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:1px;
  padding:5px 11px;
  border-radius:4px;
  cursor:pointer;
  transition:all .15s;
}
.btn-ref:hover { background:var(--accent); color:#000; border-color:var(--accent); }

/* STATS BAR - this is the legend */
.stats-row {
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 22px;
  height:38px;
  display:flex;
  align-items:center;
  gap:24px;
  overflow-x:auto;
}
.si {
  display:flex;
  align-items:center;
  gap:7px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  white-space:nowrap;
  color:var(--text-dim);
}
.sdot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
.sn { font-weight:700; color:var(--text); }

/* CONTROLS */
.controls {
  padding:12px 22px;
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.sw { position:relative; }
.sico { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:11px; pointer-events:none; }
.search-box {
  background:var(--surface2);
  border:1px solid var(--border2);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  padding:6px 10px 6px 27px;
  border-radius:5px;
  width:190px;
  outline:none;
  transition:border-color .15s;
}
.search-box:focus { border-color:var(--accent); }
.search-box::placeholder { color:var(--text-dim); }
.fg { display:flex; gap:5px; flex-wrap:wrap; }
.fb {
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text-dim);
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  letter-spacing:.5px;
  padding:5px 10px;
  border-radius:4px;
  cursor:pointer;
  text-transform:uppercase;
  transition:all .15s;
}
.fb:hover { border-color:var(--accent); color:var(--accent); }
.fb.active { background:var(--accent); color:#000; border-color:var(--accent); font-weight:700; }
.fb.fp.active { background:var(--orange); border-color:var(--orange); }
.fb.fp:hover:not(.active) { border-color:var(--orange); color:var(--orange); }

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(265px,1fr));
  gap:9px;
  padding:14px 22px;
}

/* CARD */
.card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  cursor:pointer;
  transition:transform .15s, box-shadow .15s;
  position:relative;
  overflow:hidden;
}
.card:hover { transform:translateY(-2px); }
.card::before {
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  border-radius:3px 0 0 3px;
}
.card.sa::before { background:var(--green); box-shadow:0 0 8px var(--green); }
.card.sw2::before { background:var(--yellow); box-shadow:0 0 8px var(--yellow); }
.card.sb::before { background:var(--red); box-shadow:0 0 8px var(--red); }
.card.su::before { background:var(--border2); }
.card.sa { border-color:#1d3d2a; box-shadow:inset 4px 0 18px var(--green-glow); }
.card.sw2 { border-color:#3d3200; box-shadow:inset 4px 0 18px var(--yellow-glow); }
.card.sb { border-color:#3d1020; box-shadow:inset 4px 0 18px var(--red-glow); }

/* scout dimming */
.card.scf { opacity:.35; }
.card.scp { opacity:.68; }

/* overlay badge */
.ov-badge {
  display:none;
  position:absolute;
  bottom:34px;
  left:18px;
  font-family:'Orbitron',monospace;
  font-size:7px;
  font-weight:700;
  letter-spacing:2px;
  padding:2px 6px;
  border-radius:2px;
  pointer-events:none;
  z-index:3;
  text-transform:uppercase;
}
.card.scf .ov-badge { display:flex; background:var(--green); color:#000; }
.card.scp .ov-badge { display:flex; background:var(--orange); color:#000; }
.abs-badge {
  display:none;
  position:absolute;
  top:7px;
  right:12px;
  font-family:'JetBrains Mono',monospace;
  font-size:8px;
  color:var(--orange);
  background:var(--orange-glow);
  border:1px solid var(--orange);
  padding:2px 6px;
  border-radius:3px;
  letter-spacing:1px;
  z-index:3;
}
.card.ha .abs-badge { display:flex; }
.card.ha { border-top:2px solid var(--orange); }

.ci {
  padding:11px 13px 8px 17px;
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.av {
  width:40px;height:40px;
  border-radius:5px;
  object-fit:cover;
  border:1px solid var(--border2);
  background:var(--surface2);
  flex-shrink:0;
}
.avp {
  width:40px;height:40px;
  border-radius:5px;
  background:var(--surface2);
  border:1px solid var(--border2);
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Orbitron',sans-serif;
  font-size:11px;
  color:var(--text-dim);
  font-weight:700;
}
.ti { flex:1; min-width:0; }
.tn { font-family:'Orbitron',sans-serif; font-weight:900; font-size:19px; color:var(--accent); line-height:1; }
.tna { font-size:11px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.tloc { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-dim); margin-top:1px; }
.sr { display:flex; align-items:center; gap:5px; margin-top:5px; }
.sp {
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  font-weight:700;
  letter-spacing:.5px;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:3px;
}
.sa .sp { background:var(--green-glow); color:var(--green); border:1px solid #00ff9d33; }
.sw2 .sp { background:var(--yellow-glow); color:var(--yellow); border:1px solid #ffcc0033; }
.sb .sp { background:var(--red-glow); color:var(--red); border:1px solid #ff336633; }
.su .sp { background:var(--surface2); color:var(--text-dim); border:1px solid var(--border); }
.bl { width:5px;height:5px;border-radius:50%;flex-shrink:0; }
.sa .bl { background:var(--green); animation:blk 1.5s infinite; }
.sw2 .bl { background:var(--yellow); animation:blk .8s infinite; }
.sb .bl { background:var(--red); animation:blk .5s infinite; }
@keyframes blk{0%,100%{opacity:1}50%{opacity:.1}}
.dt { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* card action buttons */
.ca {
  display:flex;
  gap:5px;
  padding:0 13px 9px 17px;
}
.cab {
  flex:1;
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text-dim);
  font-family:'JetBrains Mono',monospace;
  font-size:8px;
  letter-spacing:.3px;
  padding:4px 5px;
  border-radius:4px;
  cursor:pointer;
  text-transform:uppercase;
  text-align:center;
  transition:all .15s;
}
.cab:hover { border-color:var(--accent); color:var(--accent); }
.cab.af { background:var(--green-glow); border-color:var(--green); color:var(--green); }
.cab.ap { background:var(--orange-glow); border-color:var(--orange); color:var(--orange); }

/* MODAL */
.modal-bg {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.87);
  backdrop-filter:blur(4px);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.modal-bg.open { display:flex; }
.modal {
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:10px;
  width:100%;
  max-width:490px;
  max-height:86vh;
  overflow-y:auto;
  box-shadow:0 0 60px #00aaff15;
}
.mh {
  padding:18px 20px 14px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  position:sticky;
  top:0;
  background:var(--surface);
  z-index:2;
}
.mnum { font-family:'Orbitron',sans-serif; font-weight:900; font-size:36px; color:var(--accent); line-height:1; }
.mname { font-size:15px; font-weight:700; margin-top:3px; }
.mloc { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-dim); margin-top:2px; }
.mclose {
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text-dim);
  width:28px;height:28px;
  border-radius:5px;
  cursor:pointer;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:all .15s;
}
.mclose:hover { border-color:var(--red); color:var(--red); }
.mb { padding:16px 20px; }
.mimg { width:100%; height:150px; object-fit:cover; border-radius:6px; border:1px solid var(--border2); margin-bottom:12px; background:var(--surface2); }
.msec {
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:11px 13px;
  margin-bottom:10px;
}
.mslabel {
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:var(--text-dim);
  margin-bottom:6px;
}
.msval { font-size:14px; font-weight:600; }
.msdet { font-size:11px; color:var(--text-dim); margin-top:3px; }
.mr {
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px 9px;
  border-radius:5px;
  margin-bottom:4px;
  background:var(--surface3);
  border:1px solid var(--border);
  font-size:11px;
}
.mr.md { opacity:.4; }
.mr.mn { border-color:var(--red); background:var(--red-glow); }
.mr.ms { border-color:var(--yellow); background:var(--yellow-glow); }
.mr.mp { border-left:3px solid var(--blue); }
.mkey { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-dim); min-width:76px; }
.mtime { font-family:'JetBrains Mono',monospace; font-size:10px; flex:1; }
.mb2 {
  font-family:'JetBrains Mono',monospace;
  font-size:8px;
  padding:2px 6px;
  border-radius:10px;
  text-transform:uppercase;
}
.mb2.done { background:var(--surface); color:var(--text-dim); }
.mb2.now { background:var(--red-glow); color:var(--red); }
.mb2.soon { background:var(--yellow-glow); color:var(--yellow); }
.mb2.up { background:var(--blue-glow); color:var(--blue); }
.mb2.pr { background:var(--blue-glow); color:var(--blue); border:1px solid #00aaff55; }

/* absence section in modal */
.abs-sec {
  background:var(--surface2);
  border:1px solid var(--orange);
  border-radius:6px;
  padding:11px 13px;
  margin-bottom:10px;
  display:none;
}
.abs-sec.show { display:block; }
.abs-sec .mslabel { color:var(--orange); }
.abs-row { display:flex; gap:7px; margin-top:7px; align-items:center; }
.abs-in {
  background:var(--surface3);
  border:1px solid var(--border2);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  padding:5px 8px;
  border-radius:4px;
  outline:none;
  flex:1;
  transition:border-color .15s;
}
.abs-in:focus { border-color:var(--orange); }
.abs-save {
  background:var(--orange-glow);
  border:1px solid var(--orange);
  color:var(--orange);
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  padding:5px 10px;
  border-radius:4px;
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s;
}
.abs-save:hover { background:var(--orange); color:#000; }
.abs-clr {
  background:var(--red-glow);
  border:1px solid var(--red);
  color:var(--red);
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  padding:5px 10px;
  border-radius:4px;
  cursor:pointer;
  margin-top:7px;
  transition:all .15s;
}
.abs-clr:hover { background:var(--red); color:#fff; }

/* modal action buttons */
.macts { display:flex; gap:7px; margin-top:12px; }
.mab {
  flex:1;
  padding:9px 7px;
  border-radius:6px;
  border:1px solid var(--border2);
  background:var(--surface2);
  color:var(--text-dim);
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  letter-spacing:.3px;
  text-transform:uppercase;
  cursor:pointer;
  text-align:center;
  transition:all .15s;
}
.mab:hover { border-color:var(--accent); color:var(--accent); }
.mab.mf { background:var(--green-glow); border-color:var(--green); color:var(--green); }
.mab.mp2 { background:var(--orange-glow); border-color:var(--orange); color:var(--orange); }
.mab.ma { background:var(--orange-glow); border-color:var(--orange); color:var(--orange); }

/* LOADING */
.ldo {
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  z-index:300;
}
.ldt {
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:24px;
  color:var(--accent);
  letter-spacing:4px;
  animation:blk 1s infinite;
}
.lds { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); }
.err-bar {
  background:var(--red-glow);
  border-bottom:1px solid var(--red);
  color:var(--red);
  padding:7px 22px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  display:none;
}
.nores {
  grid-column:1/-1;
  padding:50px 0;
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text-dim);
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr 1fr;gap:7px;padding:9px 10px;}
  .controls{padding:9px 10px;}
  header{padding:0 12px;}
}
</style>
</head>
<body>

<div class="ldo" id="ldo">
  <div class="ldt">CURIE PIT INTEL</div>
  <div class="lds">Connecting to The Blue Alliance...</div>
</div>

<header>
  <div class="logo">
    <div class="logo-num">254</div>
    <div>
      <div class="logo-title">Curie Pit Intel</div>
      <div class="logo-sub">WORLDS 2025 // HOUSTON</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="live-dot"></div>
    <div class="last-upd" id="lastUpd">—</div>
    <button class="btn-ref" onclick="refreshData()">↻ Sync</button>
  </div>
</header>

<div class="err-bar" id="errBar"></div>

<!-- STATS BAR = visual legend with live counts -->
<div class="stats-row">
  <div class="si"><div class="sdot" style="background:var(--green);box-shadow:0 0 5px var(--green)"></div>Available <span class="sn" id="sA">—</span></div>
  <div class="si"><div class="sdot" style="background:var(--yellow);box-shadow:0 0 5px var(--yellow)"></div>Match &lt;15m <span class="sn" id="sW">—</span></div>
  <div class="si"><div class="sdot" style="background:var(--red);box-shadow:0 0 5px var(--red)"></div>In Match <span class="sn" id="sB">—</span></div>
  <div class="si"><div class="sdot" style="background:var(--orange);box-shadow:0 0 5px var(--orange)"></div>Gone <span class="sn" id="sAb">—</span></div>
  <div class="si"><div class="sdot" style="background:var(--green)"></div>Scouted <span class="sn" id="sSc">—</span>/<span class="sn" id="sTo">—</span></div>
  <div class="si"><div class="sdot" style="background:var(--orange)"></div>Partial <span class="sn" id="sPa">—</span></div>
</div>

<div class="controls">
  <div class="sw">
    <span class="sico">⌕</span>
    <input class="search-box" id="sb" type="text" placeholder="Team # or name..." oninput="rg()">
  </div>
  <div class="fg">
    <button class="fb active" data-f="all" onclick="sf('all')">All</button>
    <button class="fb" data-f="available" onclick="sf('available')">Available</button>
    <button class="fb" data-f="busy" onclick="sf('busy')">In Match</button>
    <button class="fb" data-f="unscouted" onclick="sf('unscouted')">Unscouted</button>
    <button class="fb fp" data-f="partial" onclick="sf('partial')">Partial</button>
    <button class="fb" data-f="absent" onclick="sf('absent')">Gone</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="cbg(event)">
  <div class="modal">
    <div class="mh">
      <div>
        <div class="mnum" id="mNum"></div>
        <div class="mname" id="mNa"></div>
        <div class="mloc" id="mLo"></div>
      </div>
      <button class="mclose" onclick="cm()">✕</button>
    </div>
    <div class="mb">
      <img class="mimg" id="mIm" src="" onerror="this.style.display='none'" alt="">

      <div class="msec">
        <div class="mslabel">Current Status</div>
        <div class="msval" id="mSv"></div>
        <div class="msdet" id="mSd"></div>
      </div>

      <!-- Absence config -->
      <div class="abs-sec" id="absSec">
        <div class="mslabel">⚠ Absence Window</div>
        <div style="font-size:11px;color:var(--text-dim)">Team will show as Gone during this time range.</div>
        <div class="abs-row">
          <input class="abs-in" id="absF" type="time">
          <span style="color:var(--text-dim);font-size:10px">to</span>
          <input class="abs-in" id="absT" type="time">
          <button class="abs-save" onclick="saveAbs()">Save</button>
        </div>
        <div style="margin-top:7px;font-size:10px;color:var(--text-dim)" id="absDis"></div>
        <button class="abs-clr" onclick="clrAbs()">✕ Clear Absence</button>
      </div>

      <div class="msec">
        <div class="mslabel">Match Schedule (Qual + Practice)</div>
        <div id="mMa"></div>
      </div>

      <div class="macts">
        <button class="mab" id="mbF" onclick="tsF()">✓ Fully Scouted</button>
        <button class="mab" id="mbP" onclick="tsP()">◑ Partial</button>
        <button class="mab" id="mbA" onclick="tAbs()">⊘ Mark Gone</button>
      </div>
    </div>
  </div>
</div>

<script>

let matches = [];
let scout = JSON.parse(localStorage.getItem('ps_sc')||'{}');
let absences = JSON.parse(localStorage.getItem('ps_abs')||'{}');
let filt = 'all';
let am = null; // active modal team number
let absUI = false;

function sv(){ localStorage.setItem('ps_sc',JSON.stringify(scout)); localStorage.setItem('ps_abs',JSON.stringify(absences)); }
function ns(){ return Math.floor(Date.now()/1000); }
function ft(u){ return u?new Date(u*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—'; }
function fmk(k){
  if(!k) return '';
  const p=k.split('_'); if(p.length<2) return k;
  const m=p[1];
  if(m.startsWith('pm')) return 'Practice '+m.slice(2);
  if(m.startsWith('qm')) return 'Qual '+m.slice(2);
  if(m.startsWith('sf')) return 'SF'+m.slice(2);
  if(m.startsWith('f')) return 'Final '+m.slice(1);
  return m.toUpperCase();
}
function isp(m){ return m.comp_level==='pm'||(m.key&&m.key.includes('_pm')); }

function tm(num){
  const k=`frc${num}`;
  return matches.filter(m=>{
    const r=m.alliances?.red?.team_keys||[];
    const b=m.alliances?.blue?.team_keys||[];
    return r.includes(k)||b.includes(k);
  }).sort((a,b)=>(a.predicted_time||a.time||0)-(b.predicted_time||b.time||0));
}

function isAbsNow(num){
  const a=absences[num]; if(!a||!a.f||!a.t) return false;
  const now=new Date();
  const [fh,fm]=a.f.split(':').map(Number);
  const [th,tm2]=a.t.split(':').map(Number);
  const cur=now.getHours()*60+now.getMinutes();
  return cur>=fh*60+fm && cur<=th*60+tm2;
}

function ts(num){
  if(isAbsNow(num)) return {s:'busy',label:'Gone / Absent',detail:absences[num]?`Until ${absences[num].t}`:'',absent:true};
  const now=ns();
  // only qual matches for availability calc
  const qm=tm(num).filter(m=>!isp(m));
  if(!qm.length) return {s:'available',label:'Available',detail:'No qual schedule yet'};
  const up=qm.filter(m=>!m.actual_time);
  if(!up.length) return {s:'available',label:'All done',detail:'No more matches'};
  const nx=up[0];
  const pt=nx.predicted_time||nx.time;
  if(!pt) return {s:'available',label:'Available',detail:'No time data yet'};
  const sec=pt-now;
  const mk=fmk(nx.key);
  if(sec<-5*60) return {s:'busy',label:'In match now',detail:`Playing ${mk}`};
  if(sec<0) return {s:'busy',label:'Queuing now',detail:`${mk} starting`};
  if(sec<WARN){const m=Math.ceil(sec/60);return {s:'warning',label:`Match in ${m}m`,detail:`${mk} — wrap up`};}
  const m=Math.floor(sec/60),h=Math.floor(m/60),r=m%60;
  return {s:'available',label:`Free ${h>0?h+'h ':''}${r}m`,detail:`Next: ${mk}`};
}

function scCls(num){ const v=scout[num]; if(v==='full') return 'scf'; if(v==='partial') return 'scp'; return ''; }

function rg(){
  const q=document.getElementById('sb').value.toLowerCase();
  const stcls={available:'sa',warning:'sw2',busy:'sb',unknown:'su'};
  let teams=TEAMS.filter(t=>!q||String(t.n).includes(q)||t.name.toLowerCase().includes(q));
  if(filt==='available') teams=teams.filter(t=>ts(t.n).s==='available');
  else if(filt==='busy') teams=teams.filter(t=>['busy','warning'].includes(ts(t.n).s));
  else if(filt==='unscouted') teams=teams.filter(t=>!scout[t.n]);
  else if(filt==='partial') teams=teams.filter(t=>scout[t.n]==='partial');
  else if(filt==='absent') teams=teams.filter(t=>!!absences[t.n]);
  const ord={available:0,warning:1,busy:2,unknown:3};
  teams.sort((a,b)=>{const oa=ord[ts(a.n).s]??3,ob=ord[ts(b.n).s]??3;return oa!==ob?oa-ob:a.n-b.n;});

  // stats
  const all=TEAMS.map(t=>ts(t.n));
  document.getElementById('sA').textContent=all.filter(s=>s.s==='available').length;
  document.getElementById('sW').textContent=all.filter(s=>s.s==='warning').length;
  document.getElementById('sB').textContent=all.filter(s=>s.s==='busy'&&!s.absent).length;
  document.getElementById('sAb').textContent=TEAMS.filter(t=>isAbsNow(t.n)).length;
  document.getElementById('sSc').textContent=Object.values(scout).filter(v=>v==='full').length;
  document.getElementById('sPa').textContent=Object.values(scout).filter(v=>v==='partial').length;
  document.getElementById('sTo').textContent=TEAMS.length;

  const g=document.getElementById('grid');
  if(!teams.length){g.innerHTML='<div class="nores">No teams match this filter.</div>';return;}

  g.innerHTML=teams.map(t=>{
    const st=ts(t.n);
    const sc2=scout[t.n]||'';
    const ha=!!absences[t.n];
    const av=t.img
      ?`<img class="av" src="${t.img}" alt="${t.n}" onerror="this.outerHTML='<div class=\\'avp\\'>${String(t.n).slice(-3)}</div>'">`
      :`<div class="avp">${String(t.n).slice(-3)}</div>`;
    return `<div class="card ${stcls[st.s]||'su'} ${sc2?'sc'+sc2[0]:''} ${ha?'ha':''}" onclick="om(${t.n})">
      <div class="ov-badge">${sc2==='full'?'✓ scouted':'◑ partial'}</div>
      <div class="abs-badge">GONE</div>
      <div class="ci">${av}
        <div class="ti">
          <div class="tn">${t.n}</div>
          <div class="tna">${t.name}</div>
          <div class="tloc">${t.city}, ${t.state}</div>
          <div class="sr"><div class="sp"><div class="bl"></div>${st.label}</div></div>
          ${st.detail?`<div class="dt">${st.detail}</div>`:''}
        </div>
      </div>
      <div class="ca" onclick="event.stopPropagation()">
        <button class="cab ${sc2==='full'?'af':''}" onclick="ss(${t.n},'full')">${sc2==='full'?'✓ Done':'✓ Full'}</button>
        <button class="cab ${sc2==='partial'?'ap':''}" onclick="ss(${t.n},'partial')">${sc2==='partial'?'◑ Partial':'◑ Partial'}</button>
      </div>
    </div>`;
  }).join('');
}

function ss(num,type){ scout[num]===type?delete scout[num]:scout[num]=type; sv(); rg(); if(am===num) rm(); }
function tsF(){ ss(am,'full'); }
function tsP(){ ss(am,'partial'); }

function tAbs(){
  absUI=!absUI;
  document.getElementById('absSec').classList.toggle('show',absUI);
  document.getElementById('mbA').classList.toggle('ma',absUI);
  if(absUI&&absences[am]){ document.getElementById('absF').value=absences[am].f||''; document.getElementById('absT').value=absences[am].t||''; }
  shAbs();
}

function saveAbs(){
  const f=document.getElementById('absF').value, t2=document.getElementById('absT').value;
  if(!f||!t2) return;
  absences[am]={f,t:t2}; sv(); shAbs(); rg();
}
function clrAbs(){ delete absences[am]; sv(); document.getElementById('absF').value=''; document.getElementById('absT').value=''; shAbs(); rg(); }
function shAbs(){ const a=absences[am]; document.getElementById('absDis').textContent=a?`Set: ${a.f} – ${a.t}`:'No absence set.'; }

function om(num){
  am=num; absUI=false;
  document.getElementById('absSec').classList.remove('show');
  document.getElementById('mbA').classList.remove('ma');
  rm();
  document.getElementById('modalBg').classList.add('open');
}

function rm(){
  const num=am;
  const t=TEAMS.find(x=>x.n===num);
  const st=ts(num);
  const mlist=tm(num);
  const sc2=scout[num]||'';
  const now=ns();
  document.getElementById('mNum').textContent=num;
  document.getElementById('mNa').textContent=t.name;
  document.getElementById('mLo').textContent=`${t.city}, ${t.state}`;
  const im=document.getElementById('mIm');
  if(t.img){im.src=t.img;im.style.display='block';}else im.style.display='none';
  const col={available:'var(--green)',warning:'var(--yellow)',busy:'var(--red)',unknown:'var(--text-dim)'};
  document.getElementById('mSv').style.color=col[st.s]||col.unknown;
  document.getElementById('mSv').textContent=st.label;
  document.getElementById('mSd').textContent=st.detail||'';
  const ma=document.getElementById('mMa');
  if(!mlist.length){ma.innerHTML='<div style="color:var(--text-dim);font-size:11px;font-family:JetBrains Mono,monospace">No matches found in TBA data.</div>';}
  else{
    ma.innerHTML=mlist.map(m=>{
      const pt=m.predicted_time||m.time;
      const sec=pt?pt-now:null;
      const pr=isp(m);
      let cls='',b='';
      if(m.actual_time){cls='md';b='<span class="mb2 done">Done</span>';}
      else if(sec!==null&&sec<0){cls='mn';b='<span class="mb2 now">NOW</span>';}
      else if(sec!==null&&sec<WARN){cls='ms';b=`<span class="mb2 soon">~${Math.ceil(sec/60)}m</span>`;}
      else{cls='';b=`<span class="mb2 ${pr?'pr':'up'}">${pr?'Practice':'Upcoming'}</span>`;}
      return `<div class="mr ${cls} ${pr?'mp':''}"><div class="mkey">${fmk(m.key)}</div><div class="mtime">${ft(pt)}</div>${b}</div>`;
    }).join('');
  }
  document.getElementById('mbF').className='mab'+(sc2==='full'?' mf':'');
  document.getElementById('mbF').textContent=sc2==='full'?'✓ Scouted (undo)':'✓ Fully Scouted';
  document.getElementById('mbP').className='mab'+(sc2==='partial'?' mp2':'');
  document.getElementById('mbP').textContent=sc2==='partial'?'◑ Partial (undo)':'◑ Partial Scout';
  shAbs();
  if(absUI&&absences[num]){document.getElementById('absF').value=absences[num].f||'';document.getElementById('absT').value=absences[num].t||'';}
}

function cbg(e){if(e.target===document.getElementById('modalBg')) cm();}
function cm(){document.getElementById('modalBg').classList.remove('open');}
function sf(f){filt=f;document.querySelectorAll('.fb').forEach(b=>b.classList.toggle('active',b.dataset.f===f));rg();}

async function fetchData(){
  try{
    const r=await fetch(`https://www.thebluealliance.com/api/v3/event/${EK}/matches/simple`,{headers:{'X-TBA-Auth-Key':TBA_KEY}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){ showErr('TBA: '+e.message); return null; }
}

async function refreshData(){
  const d=await fetchData();
  if(d){matches=d;showErr(null);}
  document.getElementById('lastUpd').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  rg();
}

function showErr(msg){
  const b=document.getElementById('errBar');
  b.style.display=msg?'block':'none';
  if(msg) b.textContent='⚠ '+msg;
}

async function init(){
  await refreshData();
  document.getElementById('ldo').style.display='none';
  setInterval(refreshData,60000);
}
init();
