<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Curie Pit Scout — 254</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f0;
  --surface: #ffffff;
  --surface2: #f0f0eb;
  --border: #e2e2dc;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --yellow: #ca8a04;
  --yellow-bg: #fef9c3;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --blue: #2563eb;
  --blue-bg: #dbeafe;
  --orange: #ea580c;
  --orange-bg: #ffedd5;
  --text: #1a1a1a;
  --text-mid: #6b6b6b;
  --text-dim: #a3a3a3;
  --radius: 12px;
  --radius-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-badge {
  background: #1a1a1a;
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  padding: 4px 9px;
  border-radius: 6px;
  letter-spacing: -.3px;
}
.logo-text {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.logo-sub {
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  margin-top: 1px;
}
.hdr-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.live-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--green-bg);
  color: var(--green);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 9px;
  border-radius: 20px;
}
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.btn-sync {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-mid);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 4px;
}
.btn-sync:active { transform: scale(.96); }

/* ERR BAR */
.err-bar {
  display: none;
  background: var(--red-bg);
  color: var(--red);
  font-size: 12px;
  font-weight: 500;
  padding: 8px 16px;
  border-bottom: 1px solid #fecaca;
}

/* STATS ROW */
.stats-row {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.stats-row::-webkit-scrollbar { display: none; }
.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 14px;
  min-width: 60px;
  position: relative;
}
.stat-item + .stat-item::before {
  content: '';
  position: absolute;
  left: 0; top: 25%; bottom: 25%;
  width: 1px;
  background: var(--border);
}
.stat-num {
  font-size: 18px;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
  line-height: 1;
}
.stat-label {
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 500;
  margin-top: 2px;
  white-space: nowrap;
}
.stat-green .stat-num { color: var(--green); }
.stat-yellow .stat-num { color: var(--yellow); }
.stat-red .stat-num { color: var(--red); }
.stat-orange .stat-num { color: var(--orange); }

/* SEARCH + FILTERS */
.controls {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 56px;
  z-index: 90;
  background: var(--surface);
}
.search-wrap {
  position: relative;
}
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 16px;
  pointer-events: none;
}
.search-box {
  width: 100%;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  padding: 10px 12px 10px 38px;
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color .15s;
}
.search-box:focus { border-color: #1a1a1a; background: var(--surface); }
.search-box::placeholder { color: var(--text-dim); }
.filter-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 1px;
}
.filter-row::-webkit-scrollbar { display: none; }
.fb {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  color: var(--text-mid);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  flex-shrink: 0;
}
.fb:active { transform: scale(.95); }
.fb.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.fb.f-avail.active { background: var(--green); border-color: var(--green); }
.fb.f-busy.active { background: var(--red); border-color: var(--red); }
.fb.f-partial.active { background: var(--orange); border-color: var(--orange); }

/* GRID */
.grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 16px;
}

/* CARD */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: transform .12s, box-shadow .12s;
  overflow: hidden;
  active-scale: .98;
}
.card:active { transform: scale(.98); }
.card.s-available { border-left: 4px solid var(--green); }
.card.s-warning   { border-left: 4px solid var(--yellow); }
.card.s-busy      { border-left: 4px solid var(--red); }
.card.s-unknown   { border-left: 4px solid var(--border); }
.card.sc-full     { opacity: .45; }
.card.sc-partial  { opacity: .7; }
.card.c-absent    { border-top: 2px solid var(--orange); }

.card-body {
  padding: 12px 14px 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.team-avatar {
  width: 44px; height: 44px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--surface2);
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.team-initials {
  width: 44px; height: 44px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-mid);
}
.team-info { flex: 1; min-width: 0; }
.team-num {
  font-size: 20px;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
  line-height: 1;
  color: var(--text);
}
.team-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-mid);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}
.status-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  white-space: nowrap;
}
.s-available .status-pill { background: var(--green-bg); color: var(--green); }
.s-warning .status-pill   { background: var(--yellow-bg); color: var(--yellow); }
.s-busy .status-pill      { background: var(--red-bg); color: var(--red); }
.s-unknown .status-pill   { background: var(--surface2); color: var(--text-dim); }
.time-est {
  font-size: 11px;
  color: var(--green);
  font-family: 'DM Mono', monospace;
  text-align: right;
  font-weight: 500;
}
.time-est.free-in {
  color: var(--text-dim);
  font-weight: 400;
}
.absent-tag {
  font-size: 10px;
  font-weight: 600;
  color: var(--orange);
  background: var(--orange-bg);
  padding: 2px 7px;
  border-radius: 4px;
}
.scout-tag {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 4px;
}
.scout-tag.full    { background: var(--green-bg); color: var(--green); }
.scout-tag.partial { background: var(--orange-bg); color: var(--orange); }

/* CARD ACTIONS */
.card-actions {
  display: flex;
  border-top: 1px solid var(--border);
}
.ca-btn {
  flex: 1;
  background: none;
  border: none;
  padding: 9px 0;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-mid);
  cursor: pointer;
  transition: background .1s;
}
.ca-btn + .ca-btn { border-left: 1px solid var(--border); }
.ca-btn:active { background: var(--surface2); }
.ca-btn.active-full    { color: var(--green); font-weight: 600; }
.ca-btn.active-partial { color: var(--orange); font-weight: 600; }

/* RECOMMENDATION TAG */
.rec-tag {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  white-space: nowrap;
}
.rec-go     { background: var(--green-bg);  color: var(--green); }
.rec-rush   { background: var(--yellow-bg); color: var(--yellow); }
.rec-wait   { background: var(--red-bg);    color: var(--red); }
.rec-done   { background: var(--surface2);  color: var(--text-dim); }

/* MODAL */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  animation: slideUp .22s ease-out;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 0;
}
.modal-header {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.m-num  { font-size: 32px; font-weight: 700; font-family: 'DM Mono', monospace; line-height: 1; }
.m-name { font-size: 15px; font-weight: 600; margin-top: 3px; }
.m-loc  { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.m-close {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-mid);
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.modal-body { padding: 14px 18px 30px; }
.modal-img {
  width: 100%; height: 140px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  margin-bottom: 14px;
  background: var(--surface2);
}
.msec {
  background: var(--surface2);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.msec-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.msec-val  { font-size: 17px; font-weight: 700; }
.msec-sub  { font-size: 12px; color: var(--text-mid); margin-top: 3px; }
.m-status-avail { color: var(--green); }
.m-status-warn  { color: var(--yellow); }
.m-status-busy  { color: var(--red); }
.m-status-unk   { color: var(--text-dim); }

/* recommendation box in modal */
.m-rec-box {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  margin-top: 8px;
  font-size: 13px;
  font-weight: 600;
}
.m-rec-go   { background: var(--green-bg);  color: var(--green); }
.m-rec-rush { background: var(--yellow-bg); color: var(--yellow); }
.m-rec-wait { background: var(--red-bg);    color: var(--red); }
.m-rec-done { background: var(--surface2);  color: var(--text-mid); }

/* match rows in modal */
.match-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
}
.match-row.m-done   { opacity: .5; }
.match-row.m-active { background: var(--red-bg); border-color: #fecaca; }
.match-row.m-soon   { background: var(--yellow-bg); border-color: #fde68a; }
.match-row.m-practice { border-left: 3px solid var(--blue); }
.match-key  { font-size: 13px; font-weight: 600; }
.match-time { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-mid); }
.match-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
}
.mb-done     { background: var(--surface2);  color: var(--text-dim); }
.mb-now      { background: var(--red-bg);    color: var(--red); }
.mb-soon     { background: var(--yellow-bg); color: var(--yellow); }
.mb-practice { background: var(--blue-bg);   color: var(--blue); }
.mb-upcoming { background: var(--surface2);  color: var(--text-mid); }

/* Absence section */
.abs-sec {
  display: none;
  background: var(--orange-bg);
  border: 1px solid #fed7aa;
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.abs-sec.show { display: block; }
.abs-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.abs-in {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  outline: none;
  flex: 1;
  min-width: 100px;
}
.abs-save {
  background: var(--orange);
  color: #fff;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.abs-clr {
  background: none;
  border: 1px solid #fed7aa;
  color: var(--orange);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-top: 6px;
}
.abs-dis { font-size: 11px; color: var(--orange); margin-top: 5px; }

/* modal action buttons */
.m-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.mab {
  flex: 1;
  min-width: 120px;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  color: var(--text-mid);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: center;
  transition: all .15s;
}
.mab:active { transform: scale(.97); }
.mab.m-full    { background: var(--green-bg); color: var(--green); border-color: #86efac; }
.mab.m-partial { background: var(--orange-bg); color: var(--orange); border-color: #fdba74; }
.mab.m-absent  { background: var(--orange-bg); color: var(--orange); border-color: #fdba74; }

/* Loading */
.ldo {
  position: fixed;
  inset: 0;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  gap: 10px;
}
.ldo-title { font-size: 20px; font-weight: 700; }
.ldo-sub { font-size: 13px; color: var(--text-dim); }
.ldo-spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--border);
  border-top-color: #1a1a1a;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* No results */
.nores {
  text-align: center;
  color: var(--text-dim);
  padding: 40px 20px;
  font-size: 14px;
}
</style>
</head>
<body>

<div class="ldo" id="ldo">
  <div class="ldo-spinner"></div>
  <div class="ldo-title">Curie Pit Intel</div>
  <div class="ldo-sub">Loading match data…</div>
</div>

<header>
  <div class="logo">
    <div class="logo-badge">254</div>
    <div>
      <div class="logo-text">Curie Pit Intel</div>
      <div class="logo-sub">Worlds 2026 · Houston</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="live-pill"><div class="live-dot"></div><span id="lastUpd">—</span></div>
    <button class="btn-sync" onclick="refreshData()">↻</button>
  </div>
</header>

<div class="err-bar" id="errBar"></div>

<div class="stats-row">
  <div class="stat-item stat-green"><div class="stat-num" id="sA">—</div><div class="stat-label">Free</div></div>
  <div class="stat-item stat-yellow"><div class="stat-num" id="sW">—</div><div class="stat-label">Soon</div></div>
  <div class="stat-item stat-red"><div class="stat-num" id="sB">—</div><div class="stat-label">Busy</div></div>
  <div class="stat-item stat-orange"><div class="stat-num" id="sAb">—</div><div class="stat-label">Gone</div></div>
  <div class="stat-item stat-green"><div class="stat-num" id="sSc">—</div><div class="stat-label">Scouted</div></div>
  <div class="stat-item stat-orange"><div class="stat-num" id="sPa">—</div><div class="stat-label">Partial</div></div>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-box" id="sb" type="search" inputmode="numeric" placeholder="Search team # or name…" oninput="rg()">
  </div>
  <div class="filter-row">
    <button class="fb active" data-f="all" onclick="sf('all')">All</button>
    <button class="fb f-avail" data-f="available" onclick="sf('available')">✓ Free Now</button>
    <button class="fb f-busy" data-f="busy" onclick="sf('busy')">In Match</button>
    <button class="fb" data-f="unscouted" onclick="sf('unscouted')">Unscouted</button>
    <button class="fb f-partial" data-f="partial" onclick="sf('partial')">Partial</button>
    <button class="fb" data-f="absent" onclick="sf('absent')">Done</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="cbg(event)">
  <div class="modal" id="modalEl">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div>
        <div class="m-num" id="mNum"></div>
        <div class="m-name" id="mNa"></div>
        <div class="m-loc" id="mLo"></div>
      </div>
      <button class="m-close" onclick="cm()">✕</button>
    </div>
    <div class="modal-body">
      <img class="modal-img" id="mIm" src="" onerror="this.style.display='none'" alt="">

      <div class="msec">
        <div class="msec-label">Current Status</div>
        <div class="msec-val" id="mSv"></div>
        <div class="msec-sub" id="mSd"></div>
        <div id="mRec"></div>
      </div>

      <div class="abs-sec" id="absSec">
        <div class="msec-label" style="color:var(--orange)">Mark as Gone</div>
        <div style="font-size:12px;color:var(--orange)">Team will show as Gone during this time range.</div>
        <div class="abs-row">
          <input class="abs-in" id="absF" type="time" placeholder="From">
          <span style="color:var(--text-dim);font-size:13px">→</span>
          <input class="abs-in" id="absT" type="time" placeholder="Until">
          <button class="abs-save" onclick="saveAbs()">Save</button>
        </div>
        <div class="abs-dis" id="absDis"></div>
        <button class="abs-clr" onclick="clrAbs()">✕ Clear Absence</button>
      </div>

      <div class="msec">
        <div class="msec-label">Match Schedule</div>
        <div id="mMa"></div>
      </div>

let tbaMatches = []; // from TBA

function ns() { return Math.floor(Date.now() / 1000); }

function ft(u) {
  if (!u) return '—';
  const d = typeof u === 'string' ? new Date(u) : new Date(u * 1000);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function fmins(sec) {
  if (sec < 60) return '<1m';
  const m = Math.floor(sec / 60);
  const h = Math.floor(m / 60);
  const r = m % 60;
  return h > 0 ? `${h}h ${r}m` : `${m}m`;
}

function isp(m) { return m.comp_level === 'pm' || (m.key && m.key.includes('_pm')); }

// Get all matches for a team (TBA qual + TBA practice + hardcoded practice)
function getTeamMatches(num) {
  const k = `frc${num}`;
  const tbaList = tbaMatches.filter(m => {
    const r = m.alliances?.red?.team_keys || [];
    const b = m.alliances?.blue?.team_keys || [];
    return r.includes(k) || b.includes(k);
  });

  // Build practice matches from hardcoded schedule (use TBA data to mark completed)
  const practiceList = PRACTICE_SCHEDULE
    .filter(pm => pm.red.includes(num) || pm.blue.includes(num))
    .map(pm => {
      // check if TBA has completion data for this practice match
      const tbaMatch = tbaMatches.find(m => {
        if (!isp(m)) return false;
        const r = m.alliances?.red?.team_keys || [];
        const b = m.alliances?.blue?.team_keys || [];
        // match by team set approximation or match number in key
        const key = m.key || '';
        const keyNum = key.match(/pm(\d+)/);
        if (keyNum && parseInt(keyNum[1]) === pm.num) return true;
        return false;
      });
      return {
        _isPracticeHardcoded: true,
        _practiceNum: pm.num,
        key: `${EK}_pm${pm.num}`,
        comp_level: 'pm',
        actual_time: tbaMatch?.actual_time || completedPractice[pm.num] || null,
        time: Math.floor(new Date(pm.time).getTime() / 1000),
        predicted_time: tbaMatch?.predicted_time || Math.floor(new Date(pm.time).getTime() / 1000),
        alliances: {
          red: { team_keys: pm.red.map(n => `frc${n}`) },
          blue: { team_keys: pm.blue.map(n => `frc${n}`) }
        }
      };
    });

  // merge: prefer TBA practice if exists, else use hardcoded
  const tbaPractice = tbaList.filter(isp);
  const tbaQual = tbaList.filter(m => !isp(m));

  // Use TBA practice if we have it, else hardcoded
  const finalPractice = tbaPractice.length ? tbaPractice : practiceList;

  return [...finalPractice, ...tbaQual].sort((a, b) =>
    (a.predicted_time || a.time || 0) - (b.predicted_time || b.time || 0)
  );
}

function isAbsNow(num) {
  const a = absences[num];
  if (!a || !a.f || !a.t) return false;
  const now = new Date();
  const [fh, fm] = a.f.split(':').map(Number);
  const [th, tm2] = a.t.split(':').map(Number);
  const cur = now.getHours() * 60 + now.getMinutes();
  return cur >= fh * 60 + fm && cur <= th * 60 + tm2;
}

function fmk(key) {
  if (!key) return '';
  const p = key.split('_');
  if (p.length < 2) return key;
  const m = p[1];
  if (m.startsWith('pm')) return 'Practice ' + m.slice(2);
  if (m.startsWith('qm')) return 'Qual ' + m.slice(2);
  if (m.startsWith('sf')) return 'SF' + m.slice(2);
  if (m.startsWith('f'))  return 'Final ' + m.slice(1);
  return m.toUpperCase();
}

// Returns full team status including time estimate and recommendation
function teamStatus(num) {
  if (isAbsNow(num)) {
    return {
      s: 'busy',
      label: 'Gone / Absent',
      detail: absences[num] ? `Until ${absences[num].t}` : '',
      absent: true,
      rec: 'wait',
      recText: 'Team marked as gone',
      timeEst: null
    };
  }

  const now = ns();
  const allMatches = getTeamMatches(num);
  const upcoming = allMatches.filter(m => !m.actual_time);

  if (!allMatches.length) {
    return { s: 'available', label: 'Free', detail: 'No matches scheduled', rec: 'go', recText: 'Go now!', timeEst: 'Free all day', freeIn: null };
  }
  if (!upcoming.length) {
    return { s: 'available', label: 'All done', detail: 'All matches complete', rec: 'go', recText: 'Go now!', timeEst: 'Free now', freeIn: null };
  }

  const nx = upcoming[0];
  const pt = nx.predicted_time || nx.time;
  if (!pt) {
    return { s: 'available', label: 'Free', detail: 'No time data', rec: 'go', recText: 'Go now — no schedule conflict', timeEst: '—', freeIn: null };
  }

  const sec = pt - now;
  const mk = fmk(nx.key);
  const isPractice = isp(nx);
  const matchType = isPractice ? 'practice' : 'qual';

  if (sec < -8 * 60) {
    // In match (started more than 8m ago)
    return {
      s: 'busy',
      label: 'In match now',
      detail: `Playing ${mk}`,
      rec: 'wait',
      recText: `Come back ~${ft(pt + 10 * 60)}`,
      timeEst: null, freeIn: `Free ~${ft(pt + 10 * 60)}`
    };
  }
  if (sec < 0) {
    return {
      s: 'busy',
      label: 'In match now',
      detail: `${mk} — in queue`,
      rec: 'wait',
      recText: `In queue — come back ~${ft(pt + 10 * 60)}`,
      timeEst: null, freeIn: `Free ~${ft(pt + 10 * 60)}`
    };
  }

  const minLeft = Math.round(sec / 60);

  if (sec < PIT_SCOUT_DURATION) {
    // Not enough time to pit scout before match
    return {
      s: 'warning',
      label: `${mk} in ${minLeft}m`,
      detail: `Not enough time — match too close`,
      rec: 'wait',
      recText: `Come back after ${mk} (~${ft(pt + 10 * 60)})`,
      timeEst: null, freeIn: `Free ~${ft(pt + 10 * 60)}`
    };
  }

  if (sec < WARN) {
    // 13–15 min window: tight but possible
    return {
      s: 'warning',
      label: `${mk} in ${minLeft}m`,
      detail: `Tight — ${minLeft}m until ${matchType}`,
      rec: 'rush',
      recText: `Go now but be quick! ${mk} in ${minLeft}m`,
      timeEst: null, freeIn: `Free ~${ft(pt + 10 * 60)}`
    };
  }

  // Comfortably free
  return {
    s: 'available',
    label: 'Free',
    detail: `Next: ${mk} in ${fmins(sec)}`,
    rec: 'go',
    recText: `Go now! ${mk} not until ${ft(pt)}`,
    timeEst: `Free for ${fmins(sec)}`, freeIn: null
  };
}

function rg() {
  const q = document.getElementById('sb').value.toLowerCase().trim();
  let teams = TEAMS.filter(t => !q || String(t.n).includes(q) || t.name.toLowerCase().includes(q));

  if (filt === 'available') teams = teams.filter(t => teamStatus(t.n).s === 'available');
  else if (filt === 'busy') teams = teams.filter(t => ['busy', 'warning'].includes(teamStatus(t.n).s));
  else if (filt === 'unscouted') teams = teams.filter(t => !scout[t.n]);
  else if (filt === 'partial') teams = teams.filter(t => scout[t.n] === 'partial');
  else if (filt === 'absent') teams = teams.filter(t => !!absences[t.n]);

  const ord = { available: 0, warning: 1, busy: 2, unknown: 3 };
  teams.sort((a, b) => {
    const oa = ord[teamStatus(a.n).s] ?? 3;
    const ob = ord[teamStatus(b.n).s] ?? 3;
    return oa !== ob ? oa - ob : a.n - b.n;
  });

  // Stats
  const all = TEAMS.map(t => teamStatus(t.n));
  document.getElementById('sA').textContent = all.filter(s => s.s === 'available').length;
  document.getElementById('sW').textContent = all.filter(s => s.s === 'warning').length;
  document.getElementById('sB').textContent = all.filter(s => s.s === 'busy' && !s.absent).length;
  document.getElementById('sAb').textContent = TEAMS.filter(t => isAbsNow(t.n)).length;
  document.getElementById('sSc').textContent = Object.values(scout).filter(v => v === 'full').length;
  document.getElementById('sPa').textContent = Object.values(scout).filter(v => v === 'partial').length;

  const g = document.getElementById('grid');
  if (!teams.length) {
    g.innerHTML = '<div class="nores">No teams match this filter.</div>';
    return;
  }

  const recCls = { go: 'rec-go', rush: 'rec-rush', wait: 'rec-wait', done: 'rec-done' };

  g.innerHTML = teams.map(t => {
    const st = teamStatus(t.n);
    const sc2 = scout[t.n] || '';
    const ha = !!absences[t.n];
    const av = t.img
      ? `<img class="team-avatar" src="${t.img}" alt="${t.n}" onerror="this.outerHTML='<div class=\\'team-initials\\'>${String(t.n).slice(-3)}</div>'">`
      : `<div class="team-initials">${String(t.n).slice(-3)}</div>`;

    const badgeRight = ha
      ? `<span class="absent-tag">GONE</span>`
      : sc2 === 'full'
        ? `<span class="scout-tag full">✓ Done</span>`
        : sc2 === 'partial'
          ? `<span class="scout-tag partial">◑ Partial</span>`
          : '';

    const timeTag = st.timeEst ? `<div class="time-est">${st.timeEst}</div>` : (st.freeIn ? `<div class="time-est free-in">${st.freeIn}</div>` : '');

    return `<div class="card s-${st.s} ${sc2 ? 'sc-' + sc2 : ''} ${ha ? 'c-absent' : ''}" onclick="om(${t.n})">
      <div class="card-body">
        ${av}
        <div class="team-info">
          <div class="team-num">${t.n}</div>
          <div class="team-name">${t.name}</div>
        </div>
        <div class="card-right">
          ${badgeRight}
          <span class="status-pill">${st.label}</span>
          ${timeTag}
          ${st.rec && !ha && !sc2 ? `<span class="rec-tag ${recCls[st.rec] || ''}">${st.rec === 'go' ? '→ Go' : st.rec === 'rush' ? '⚡ Rush' : '⏳ Wait'}</span>` : ''}
        </div>
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="ca-btn ${sc2 === 'full' ? 'active-full' : ''}" onclick="ss(${t.n},'full')">${sc2 === 'full' ? '✓ Scouted' : '✓ Full'}</button>
        <button class="ca-btn ${sc2 === 'partial' ? 'active-partial' : ''}" onclick="ss(${t.n},'partial')">${sc2 === 'partial' ? '◑ Partial ✓' : '◑ Partial'}</button>
      </div>
    </div>`;
  }).join('');
}

function ss(num, type) {
  scout[num] === type ? delete scout[num] : scout[num] = type;
  sv(); rg();
  if (am === num) rm();
}
function tsF() { ss(am, 'full'); }
function tsP() { ss(am, 'partial'); }

function tAbs() {
  absUI = !absUI;
  document.getElementById('absSec').classList.toggle('show', absUI);
  document.getElementById('mbA').classList.toggle('m-absent', absUI);
  if (absUI && absences[am]) {
    document.getElementById('absF').value = absences[am].f || '';
    document.getElementById('absT').value = absences[am].t || '';
  }
  shAbs();
}

function saveAbs() {
  const f = document.getElementById('absF').value;
  const t2 = document.getElementById('absT').value;
  if (!f || !t2) return;
  absences[am] = { f, t: t2 };
  sv(); shAbs(); rg();
}

function clrAbs() {
  delete absences[am];
  sv();
  document.getElementById('absF').value = '';
  document.getElementById('absT').value = '';
  shAbs(); rg();
}

  const a = absences[am];

function om(num) {
  am = num;
  absUI = false;
  document.getElementById('absSec').classList.remove('show');
  document.getElementById('mbA').classList.remove('m-absent');
  rm();
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('modalEl').scrollTop = 0;
}

function rm() {
  const num = am;
  const t = TEAMS.find(x => x.n === num);
  const st = teamStatus(num);
  const mlist = getTeamMatches(num);
  const sc2 = scout[num] || '';
  const now = ns();

  document.getElementById('mNum').textContent = num;
  document.getElementById('mNa').textContent = t.name;
  document.getElementById('mLo').textContent = `${t.city}, ${t.state}`;

  const im = document.getElementById('mIm');
  if (t.img) { im.src = t.img; im.style.display = 'block'; } else im.style.display = 'none';

  const colMap = { available: 'm-status-avail', warning: 'm-status-warn', busy: 'm-status-busy', unknown: 'm-status-unk' };
  const sv2 = document.getElementById('mSv');
  sv2.className = 'msec-val ' + (colMap[st.s] || '');
  sv2.textContent = st.label;
  document.getElementById('mSd').textContent = st.detail || '';

  // Recommendation box
  const recEl = document.getElementById('mRec');
  const recCls2 = { go: 'm-rec-go', rush: 'm-rec-rush', wait: 'm-rec-wait', done: 'm-rec-done' };
  const recIcon = { go: '✅', rush: '⚡', wait: '⏳', done: '✓' };
  recEl.innerHTML = st.rec
    ? `<div class="m-rec-box ${recCls2[st.rec] || ''}">${recIcon[st.rec] || ''} ${st.recText}</div>`
    : '';

  // Match list
  const ma = document.getElementById('mMa');
  if (!mlist.length) {
    ma.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:8px 0">No matches found.</div>';
  } else {
    ma.innerHTML = mlist.map(m => {
      const pt = m.predicted_time || m.time;
      const sec = pt ? pt - now : null;
      const pr = isp(m);
      let cls = '', badge = '';
      if (m.actual_time) {
        cls = 'm-done';
        badge = `<span class="match-badge mb-done">Done</span>`;
      } else if (sec !== null && sec < 0) {
        cls = 'm-active';
        badge = `<span class="match-badge mb-now">NOW</span>`;
      } else if (sec !== null && sec < WARN) {
        cls = 'm-soon';
        badge = `<span class="match-badge mb-soon">~${Math.ceil(sec / 60)}m</span>`;
      } else if (pr) {
        badge = `<span class="match-badge mb-practice">Practice</span>`;
      } else {
        badge = `<span class="match-badge mb-upcoming">Upcoming</span>`;
      }
      return `<div class="match-row ${cls} ${pr ? 'm-practice' : ''}">
        <div class="match-key">${fmk(m.key)}</div>
        <div class="match-time">${ft(pt)}</div>
        ${badge}
      </div>`;
    }).join('');
  }

  // Scout buttons
  document.getElementById('mbF').className = 'mab' + (sc2 === 'full' ? ' m-full' : '');
  document.getElementById('mbF').textContent = sc2 === 'full' ? '✓ Scouted (undo)' : '✓ Fully Scouted';
  document.getElementById('mbP').className = 'mab' + (sc2 === 'partial' ? ' m-partial' : '');
  document.getElementById('mbP').textContent = sc2 === 'partial' ? '◑ Partial (undo)' : '◑ Partial Scout';
  shAbs();
  if (absUI && absences[num]) {
    document.getElementById('absF').value = absences[num].f || '';
    document.getElementById('absT').value = absences[num].t || '';
  }
}

function cbg(e) { if (e.target === document.getElementById('modalBg')) cm(); }
function cm() { document.getElementById('modalBg').classList.remove('open'); }
function sf(f) {
  filt = f;
  document.querySelectorAll('.fb').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  rg();
}

function showErr(msg) {
  const b = document.getElementById('errBar');
  b.style.display = msg ? 'block' : 'none';
  if (msg) b.textContent = '⚠ ' + msg;
}

async function fetchTBA() {
  try {
    const r = await fetch(
      `https://www.thebluealliance.com/api/v3/event/${EK}/matches/simple`,
      { method: 'GET', headers: { 'X-TBA-Auth-Key': TBA_KEY, 'Accept': 'application/json' } }
    );
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) {
    // TBA may not have this event live yet — silently fall back to hardcoded schedule
    console.warn('TBA unavailable, using hardcoded schedule:', e.message);
    return null;
  }
}

async function refreshData() {
  const d = await fetchTBA();
  if (d) {
    tbaMatches = d;
    showErr(null);
    // Update completed practice match map from TBA data
    d.filter(isp).forEach(m => {
      if (m.actual_time) {
        const key = m.key || '';
        const numMatch = key.match(/pm(\d+)/);
        if (numMatch) completedPractice[parseInt(numMatch[1])] = m.actual_time;
      }
    });
  }
  document.getElementById('lastUpd').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  rg();
  if (am) rm(); // refresh modal if open
}

async function init() {
  // Immediately render with hardcoded practice data so the app is usable instantly
  rg();
  document.getElementById('ldo').style.display = 'none';

  // Then fetch from TBA
  await refreshData();

  // Auto-refresh every 60s
  setInterval(refreshData, 60000);
  // Also refresh display every 30s for countdown timers
  setInterval(rg, 30000);
}

init();
</script>
</body>
</html>
